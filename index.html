<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azumi Designs - Studio Hub</title>
<style>
  :root {
    --bg: #f5f3ef;
    --surface: #ffffff;
    --text: #2b2826;
    --muted: #7a7570;
    --border: #e2ddd6;
    --accent: #b5703e;
    --accent-dark: #95592f;
    --danger: #c0524a;
    --success: #5a8a5e;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  [data-theme="dark"] {
    --bg: #1b1815;
    --surface: #262220;
    --text: #f0ece6;
    --muted: #a39c94;
    --border: #3a352f;
    --accent: #d99a64;
    --accent-dark: #c98a52;
    --danger: #e08077;
    --success: #7fbf83;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s, color 0.2s;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 900px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* ----- Header ----- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: 0.3px; }
  header h1 span { color: var(--accent); }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem; color: var(--text);
  }
  .icon-btn:active { transform: scale(0.96); }

  /* ----- Tabs / Nav ----- */
  nav.tabs {
    display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 60px; z-index: 9; overflow-x: auto;
  }
  nav.tabs button {
    flex: 1; min-width: 90px; padding: 12px 8px; background: none; border: none;
    font-size: 0.85rem; font-weight: 600; color: var(--muted); cursor: pointer;
    border-bottom: 3px solid transparent; white-space: nowrap;
  }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { flex: 1; padding: 16px; padding-bottom: 40px; }

  /* ----- Cards / sections ----- */
  .section-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow);
  }

  /* ----- Forms ----- */
  label { font-size: 0.8rem; color: var(--muted); display: block; margin: 8px 0 4px; font-weight: 600; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 0.95rem; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 16px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; background: var(--accent); color: #fff; transition: background 0.15s;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: var(--danger); }
  .btn.full { width: 100%; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn.small { padding: 6px 10px; font-size: 0.78rem; }

  /* ----- Auth screen ----- */
  .auth-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .auth-card { width: 100%; max-width: 380px; }
  .auth-card h2 { text-align: center; margin-top: 0; }
  .auth-toggle { text-align: center; margin-top: 14px; font-size: 0.85rem; }
  .auth-toggle a { color: var(--accent); cursor: pointer; font-weight: 700; text-decoration: none; }
  .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 8px; min-height: 1em; }
  .role-tag {
    display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px;
    background: var(--accent); color: #fff; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ----- List items ----- */
  .item {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    background: var(--bg);
  }
  .item-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .item-title { font-weight: 700; font-size: 0.95rem; }
  .item-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .item-notes { font-size: 0.82rem; margin-top: 6px; white-space: pre-wrap; }
  .badge {
    font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 12px;
    background: rgba(181,112,62,0.15); color: var(--accent); white-space: nowrap;
  }
  .badge.done { background: rgba(90,138,94,0.15); color: var(--success); }
  .link-item a { color: var(--accent); font-weight: 700; word-break: break-all; text-decoration: none; }
  .link-item a:hover { text-decoration: underline; }

  .empty-msg { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 20px 0; }
  .hidden { display: none !important; }

  /* Scope table - mobile-first stacked cards, becomes table on wider screens */
  @media (min-width: 640px) {
    .scope-grid { display: grid; grid-template-columns: 1fr 140px 130px 1fr auto; gap: 8px; align-items: start; }
    .scope-grid > div { width: 100%; }
  }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 8px; box-shadow: var(--shadow); font-size: 0.85rem;
    z-index: 100; opacity: 0; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ AUTH SCREEN ============ -->
  <div class="auth-wrap" id="authScreen">
    <div class="card auth-card">
      <h2 id="authTitle">Welcome to Azumi Hub</h2>
      <form id="authForm">
        <label for="authUsername">Username</label>
        <input type="text" id="authUsername" autocomplete="username" required>
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" autocomplete="current-password" required minlength="6">
        <div class="btn-row">
          <button type="submit" class="btn full" id="authSubmitBtn">Log In</button>
        </div>
        <div class="error-msg" id="authError"></div>
      </form>
      <div class="auth-toggle">
        <span id="authToggleText">Don't have an account?</span>
        <a id="authToggleLink">Sign up</a>
      </div>
    </div>
  </div>

  <!-- ============ MAIN APP ============ -->
  <div id="mainScreen" class="hidden">
    <header>
      <h1>Azumi<span>Hub</span></h1>
      <div class="header-actions">
        <span class="role-tag" id="userRole"></span>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
        <button class="icon-btn" id="logoutBtn" title="Log out">⎋</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="scope">📋 Scope</button>
      <button class="tab-btn" data-tab="clients">👥 Clients</button>
      <button class="tab-btn" data-tab="links">🔗 Links</button>
    </nav>

    <main>
      <!-- ========== SCOPE SHEET ========== -->
      <section id="tab-scope">
        <div class="section-title">Project Scope Sheet</div>
        <div class="card">
          <div class="scope-grid">
            <div><label>Item</label><input id="scopeItem" placeholder="e.g. Living room flooring"></div>
            <div><label>Category</label><input id="scopeCategory" placeholder="e.g. Civil"></div>
            <div><label>Status</label>
              <select id="scopeStatus">
                <option>Pending</option>
                <option>In Progress</option>
                <option>Done</option>
                <option>Blocked</option>
              </select>
            </div>
            <div><label>Notes</label><input id="scopeNotes" placeholder="Optional notes"></div>
            <div style="display:flex; align-items:flex-end;">
              <button class="btn full" id="addScopeBtn" style="margin-top:8px;">Add</button>
            </div>
          </div>
        </div>
        <div id="scopeList"></div>
      </section>

      <!-- ========== CLIENTS ========== -->
      <section id="tab-clients" class="hidden">
        <div class="section-title">Client Details</div>
        <div class="card">
          <label>Client Name</label>
          <input id="clientName" placeholder="e.g. Mr. & Mrs. Sharma">
          <label>Contact (phone / email)</label>
          <input id="clientContact" placeholder="e.g. +91 98765 43210">
          <label>Project</label>
          <input id="clientProject" placeholder="e.g. 3BHK Villa, Candolim">
          <label>Notes</label>
          <textarea id="clientNotes" placeholder="Brief, preferences, budget, etc."></textarea>
          <div class="btn-row">
            <button class="btn full" id="addClientBtn">Add Client</button>
          </div>
        </div>
        <div id="clientsList"></div>
      </section>

      <!-- ========== LINKS ========== -->
      <section id="tab-links" class="hidden">
        <div class="section-title">Important Links</div>
        <div class="card">
          <label>Title</label>
          <input id="linkTitle" placeholder="e.g. Moodboard - Project 01">
          <label>URL</label>
          <input id="linkUrl" placeholder="https://...">
          <label>Notes</label>
          <input id="linkNotes" placeholder="Optional description">
          <div class="btn-row">
            <button class="btn full" id="addLinkBtn">Add Link</button>
          </div>
        </div>
        <div id="linksList"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const API = ''; // same-origin
let token = localStorage.getItem('azumi_token') || '';
let currentUser = JSON.parse(localStorage.getItem('azumi_user') || 'null');
let isSignupMode = false;

// ---------------- THEME ----------------
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('azumi_theme', theme);
}
applyTheme(localStorage.getItem('azumi_theme') || 'light');
document.getElementById('themeToggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

// ---------------- TOAST ----------------
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------------- API HELPER ----------------
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  if (res.status === 401) {
    logout();
    throw new Error('Session expired, please log in again');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ---------------- AUTH ----------------
const authForm = document.getElementById('authForm');
const authTitle = document.getElementById('authTitle');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const authToggleText = document.getElementById('authToggleText');
const authToggleLink = document.getElementById('authToggleLink');
const authError = document.getElementById('authError');

authToggleLink.addEventListener('click', () => {
  isSignupMode = !isSignupMode;
  if (isSignupMode) {
    authTitle.textContent = 'Create an Account';
    authSubmitBtn.textContent = 'Sign Up';
    authToggleText.textContent = 'Already have an account?';
    authToggleLink.textContent = 'Log in';
  } else {
    authTitle.textContent = 'Welcome to Azumi Hub';
    authSubmitBtn.textContent = 'Log In';
    authToggleText.textContent = "Don't have an account?";
    authToggleLink.textContent = 'Sign up';
  }
  authError.textContent = '';
});

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.textContent = '';
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const endpoint = isSignupMode ? '/api/auth/signup' : '/api/auth/login';
  try {
    const data = await api(endpoint, { method: 'POST', body: JSON.stringify({ username, password }) });
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('azumi_token', token);
    localStorage.setItem('azumi_user', JSON.stringify(currentUser));
    showApp();
  } catch (err) {
    authError.textContent = err.message;
  }
});

function logout() {
  token = '';
  currentUser = null;
  localStorage.removeItem('azumi_token');
  localStorage.removeItem('azumi_user');
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
}
document.getElementById('logoutBtn').addEventListener('click', logout);

// ---------------- TABS ----------------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
  });
});

// ---------------- SHOW APP ----------------
function showApp() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');
  document.getElementById('userRole').textContent = currentUser.username + ' · ' + currentUser.role;
  loadScope();
  loadClients();
  loadLinks();
}

// ====================================================================
// SCOPE SHEET
// ====================================================================
async function loadScope() {
  try {
    const rows = await api('/api/scope');
    const container = document.getElementById('scopeList');
    if (!rows.length) { container.innerHTML = '<div class="empty-msg">No scope items yet. Add one above.</div>'; return; }
    container.innerHTML = rows.map(r => `
      <div class="item" data-id="${r.id}">
        <div class="item-row">
          <div>
            <div class="item-title">${escapeHtml(r.item)}</div>
            <div class="item-sub">${escapeHtml(r.category || '—')}</div>
          </div>
          <span class="badge ${r.status === 'Done' ? 'done' : ''}" data-role="status">${escapeHtml(r.status)}</span>
        </div>
        ${r.notes ? `<div class="item-notes">${escapeHtml(r.notes)}</div>` : ''}
        <div class="btn-row">
          <select class="btn small secondary" data-action="status" style="flex:0 0 auto;">
            ${['Pending','In Progress','Done','Blocked'].map(s => `<option ${s===r.status?'selected':''}>${s}</option>`).join('')}
          </select>
          <button class="btn small danger" data-action="delete">Delete</button>
        </div>
      </div>
    `).join('');

    container.querySelectorAll('.item').forEach(el => {
      const id = el.dataset.id;
      el.querySelector('[data-action="status"]').addEventListener('change', async (e) => {
        try {
          await api('/api/scope/' + id, { method: 'PUT', body: JSON.stringify({ status: e.target.value }) });
          loadScope();
        } catch (err) { toast(err.message); }
      });
      el.querySelector('[data-action="delete"]').addEventListener('click', async () => {
        if (!confirm('Delete this scope item?')) return;
        try {
          await api('/api/scope/' + id, { method: 'DELETE' });
          loadScope();
        } catch (err) { toast(err.message); }
      });
    });
  } catch (err) { toast(err.message); }
}

document.getElementById('addScopeBtn').addEventListener('click', async () => {
  const item = document.getElementById('scopeItem').value.trim();
  if (!item) return toast('Please enter an item');
  const category = document.getElementById('scopeCategory').value.trim();
  const status = document.getElementById('scopeStatus').value;
  const notes = document.getElementById('scopeNotes').value.trim();
  try {
    await api('/api/scope', { method: 'POST', body: JSON.stringify({ item, category, status, notes }) });
    document.getElementById('scopeItem').value = '';
    document.getElementById('scopeCategory').value = '';
    document.getElementById('scopeNotes').value = '';
    document.getElementById('scopeStatus').value = 'Pending';
    loadScope();
    toast('Scope item added');
  } catch (err) { toast(err.message); }
});

// ====================================================================
// CLIENTS
// ====================================================================
async function loadClients() {
  try {
    const rows = await api('/api/clients');
    const container = document.getElementById('clientsList');
    if (!rows.length) { container.innerHTML = '<div class="empty-msg">No clients added yet.</div>'; return; }
    container.innerHTML = rows.map(r => `
      <div class="item" data-id="${r.id}">
        <div class="item-row">
          <div>
            <div class="item-title">${escapeHtml(r.name)}</div>
            <div class="item-sub">${escapeHtml(r.project || '—')}</div>
            <div class="item-sub">${escapeHtml(r.contact || '')}</div>
          </div>
        </div>
        ${r.notes ? `<div class="item-notes">${escapeHtml(r.notes)}</div>` : ''}
        <div class="btn-row">
          <button class="btn small danger" data-action="delete">Delete</button>
        </div>
      </div>
    `).join('');

    container.querySelectorAll('.item').forEach(el => {
      const id = el.dataset.id;
      el.querySelector('[data-action="delete"]').addEventListener('click', async () => {
        if (!confirm('Delete this client?')) return;
        try {
          await api('/api/clients/' + id, { method: 'DELETE' });
          loadClients();
        } catch (err) { toast(err.message); }
      });
    });
  } catch (err) { toast(err.message); }
}

document.getElementById('addClientBtn').addEventListener('click', async () => {
  const name = document.getElementById('clientName').value.trim();
  if (!name) return toast('Please enter a client name');
  const contact = document.getElementById('clientContact').value.trim();
  const project = document.getElementById('clientProject').value.trim();
  const notes = document.getElementById('clientNotes').value.trim();
  try {
    await api('/api/clients', { method: 'POST', body: JSON.stringify({ name, contact, project, notes }) });
    document.getElementById('clientName').value = '';
    document.getElementById('clientContact').value = '';
    document.getElementById('clientProject').value = '';
    document.getElementById('clientNotes').value = '';
    loadClients();
    toast('Client added');
  } catch (err) { toast(err.message); }
});

// ====================================================================
// LINKS
// ====================================================================
async function loadLinks() {
  try {
    const rows = await api('/api/links');
    const container = document.getElementById('linksList');
    if (!rows.length) { container.innerHTML = '<div class="empty-msg">No links added yet.</div>'; return; }
    container.innerHTML = rows.map(r => `
      <div class="item link-item" data-id="${r.id}">
        <div class="item-row">
          <div>
            <div class="item-title">${escapeHtml(r.title)}</div>
            <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a>
          </div>
        </div>
        ${r.notes ? `<div class="item-notes">${escapeHtml(r.notes)}</div>` : ''}
        <div class="btn-row">
          <button class="btn small secondary" data-action="copy">Copy Link</button>
          <button class="btn small danger" data-action="delete">Delete</button>
        </div>
      </div>
    `).join('');

    container.querySelectorAll('.item').forEach(el => {
      const id = el.dataset.id;
      const url = el.querySelector('a').href;
      el.querySelector('[data-action="copy"]').addEventListener('click', () => {
        navigator.clipboard.writeText(url).then(() => toast('Link copied'));
      });
      el.querySelector('[data-action="delete"]').addEventListener('click', async () => {
        if (!confirm('Delete this link?')) return;
        try {
          await api('/api/links/' + id, { method: 'DELETE' });
          loadLinks();
        } catch (err) { toast(err.message); }
      });
    });
  } catch (err) { toast(err.message); }
}

document.getElementById('addLinkBtn').addEventListener('click', async () => {
  const title = document.getElementById('linkTitle').value.trim();
  const url = document.getElementById('linkUrl').value.trim();
  if (!title || !url) return toast('Please enter both title and URL');
  const notes = document.getElementById('linkNotes').value.trim();
  try {
    await api('/api/links', { method: 'POST', body: JSON.stringify({ title, url, notes }) });
    document.getElementById('linkTitle').value = '';
    document.getElementById('linkUrl').value = '';
    document.getElementById('linkNotes').value = '';
    loadLinks();
    toast('Link added');
  } catch (err) { toast(err.message); }
});

// ---------------- UTIL ----------------
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ---------------- INIT ----------------
if (token && currentUser) {
  showApp();
}
</script>
</body>
</html>
